version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_healthcare_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eve_healthcare?schema=public
      JWT_SECRET: eve-prod-super-secure-jwt-secret-key-32chars
      JWT_EXPIRES_IN: 24h
      WEBHOOK_SECRET: eve-payment-webhook-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eve_network

  postgres:
    image: postgres:16-alpine
    container_name: eve_healthcare_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_healthcare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

  redis:
    image: redis:7-alpine
    container_name: eve_healthcare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

volumes:
  postgres_data:
  redis_data:

networks:
  eve_network:
    driver: bridge
